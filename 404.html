<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | Gabriel</title>
<meta name="description" content="A página que você procurou não existe.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='38' font-weight='700' text-anchor='middle' fill='%2300ff66'%3EG%3C/text%3E%3C/svg%3E">
<style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #121212;
            --container-bg: rgba(20, 20, 20, 0.85);
            --terminal-bg: #0d0d0d;
            --text-color: #ffffff;
            --accent-color: #00ff66;
            --border-color: #333333;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f4f4f9;
                --container-bg: rgba(255, 255, 255, 0.9);
                --terminal-bg: #1e1e1e;
                --text-color: #1a1a1a;
                --accent-color: #0088cc;
                --border-color: #cccccc;
            }
        }

        html {
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        a:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
            border-radius: 4px;
        }

        .card {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: var(--accent-color);
            font-family: 'Courier New', Courier, monospace;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 400;
            margin: 8px 0 20px;
        }

        .terminal {
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #ffffff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            overflow-wrap: anywhere;
        }

        .terminal p {
            margin: 4px 0;
        }

        .prompt {
            color: var(--accent-color);
            font-weight: bold;
        }

        .erro {
            color: #ff5f56;
        }

        .botao {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }

        .botao:hover,
        .botao:focus-visible {
            background: var(--accent-color);
            color: #04140a;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .card {
                padding: 20px 15px;
            }

            h1 {
                font-size: 3rem;
            }

            h2 {
                font-size: 1rem;
            }

            .terminal {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .botao {
                transition: none;
            }
        }
</style>
</head>
<body>
<main class="card">
<h1>404</h1>
<h2>Essa página não existe (ou fugiu do repositório).</h2>
<div class="terminal" role="img" aria-label="Terminal mostrando erro 404: comando não encontrado">
<p><span class="prompt">gabriel@dev:~$</span> abrir pagina</p>
<p class="erro">bash: pagina: comando não encontrado</p>
<p><span class="prompt">gabriel@dev:~$</span> cd /</p>
</div>
<a class="botao" href="/">Voltar para o início</a>
</main>
</body>
</html>
