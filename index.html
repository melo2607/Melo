<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel | Estudante de Programação</title>
<meta name="description" content="Página pessoal de Gabriel — estudante de programação, membro da equipe de robótica Mega Harpy. Terminal interativo, redes sociais e playlist.">
<meta name="author" content="Gabriel Melo Silva">
<meta name="theme-color" content="#080a09">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Gabriel | Estudante de Programação">
<meta property="og:description" content="Página pessoal de Gabriel — estudante de programação. Explore o terminal interativo e descubra os comandos secretos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://open.spotify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #080a09;
            --bg-glow: radial-gradient(circle at 15% -10%, rgba(57,255,136,0.16), transparent 45%),
                       radial-gradient(circle at 100% 110%, rgba(57,255,136,0.08), transparent 40%);
            --container-bg: rgba(15, 19, 17, 0.88);
            --terminal-bg: #050706;
            --text-color: #e7f2ec;
            --text-dim: #9fb5ac;
            --accent-color: #39ff88;
            --accent-contrast: #04140a;
            --border-color: rgba(57, 255, 136, 0.16);
            --border-color-strong: rgba(57, 255, 136, 0.32);
            --focus-ring: #39ff88;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --font-display: 'Space Grotesk', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', Courier, monospace;
        }

        body.light-mode {
            --bg-color: #f3f6f2;
            --bg-glow: radial-gradient(circle at 15% -10%, rgba(9,120,74,0.08), transparent 45%),
                       radial-gradient(circle at 100% 110%, rgba(9,120,74,0.05), transparent 40%);
            --container-bg: rgba(255, 255, 255, 0.92);
            --terminal-bg: #101915;
            --text-color: #12241a;
            --text-dim: #4b6157;
            --accent-color: #0a7a4f;
            --accent-contrast: #ffffff;
            --border-color: rgba(10, 122, 79, 0.18);
            --border-color-strong: rgba(10, 122, 79, 0.35);
            --focus-ring: #0a7a4f;
            --shadow-color: rgba(20, 40, 30, 0.14);
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-glow);
            color: var(--text-color);
            font-family: var(--font-body);
            margin: 0;
            padding: 48px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .theme-switch-track {
            position: relative;
            width: 52px;
            height: 28px;
            border-radius: 999px;
            background: rgba(127, 127, 127, 0.18);
            border: 1px solid var(--border-color);
        }

        .theme-switch-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-color);
            color: var(--accent-contrast);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateX(0);
        }

        body.light-mode .theme-switch-thumb {
            transform: translateX(24px);
        }

        .main-card {
            position: relative;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 20px 60px var(--shadow-color);
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-color);
            margin: 0 0 6px;
        }

        .main-card h1 {
            font-family: var(--font-display);
            font-size: 2.15rem;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .main-card h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-dim);
            margin: 0 0 4px;
        }

        .terminal {
            background-color: var(--terminal-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
            font-family: var(--font-mono);
            padding: 0;
            margin-top: 28px;
            color: #e7f2ec;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.55), 0 12px 30px var(--shadow-color);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
        }

        .terminal-title {
            margin-left: 8px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .terminal-body {
            height: 190px;
            overflow-y: auto;
            font-size: 13.5px;
            line-height: 1.55;
            padding: 14px;
        }

        .terminal-output p { margin: 5px 0; word-break: break-word; }
        .terminal-output a { color: var(--accent-color); }

        .prompt-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.015);
        }

        .prompt-symbol {
            color: var(--accent-color);
            font-weight: bold;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #e7f2ec;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .terminal-send-btn {
            background: transparent;
            border: 1px solid var(--border-color-strong);
            color: var(--accent-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: inherit;
            cursor: pointer;
        }
        
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }
</style>
</head>
<body>

<button class="theme-switch" id="themeBtn" type="button" aria-label="Alternar tema">
    <span class="theme-switch-track"><span class="theme-switch-thumb"><i class="fa-solid fa-moon"></i></span></span>
</button>

<main class="main-card">
    <p class="eyebrow">~/gabriel</p>
    <h1>Olá, meu nome é Gabriel</h1>
    <h2>Estou aprendendo sobre programação</h2>

    <div class="terminal">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span class="terminal-title">gabriel@dev: ~</span>
        </div>
        <div class="terminal-body" id="terminalBody">
            <div class="terminal-output" id="terminalOutput">
                <p style="color: var(--accent-color);">Bem-vindo! Digite um comando (ex: <b>interestelar</b>, <b>help</b>):</p>
            </div>
        </div>
        <form class="prompt-line" id="terminalForm">
            <label for="terminalInput" class="sr-only">Digite um comando</label>
            <span class="prompt-symbol">gabriel@dev:~$</span>
            <input type="text" id="terminalInput" class="terminal-input" autocomplete="off">
            <button type="submit" class="terminal-send-btn">Enviar</button>
        </form>
    </div>
</main>

<script>
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
    });

    const terminalForm = document.getElementById('terminalForm');
    const terminalInput = document.getElementById('terminalInput');
    const terminalOutput = document.getElementById('terminalOutput');
    const terminalBody = document.getElementById('terminalBody');

    const textoAjuda = `Comandos disponíveis: <br><b>interestelar</b> — citação do filme<br><b>help</b> — mostra esta lista<br><b>clear</b> — limpa a tela`;

    const systemCommands = {
        'help': textoAjuda,
        'comandos': textoAjuda,
        'clear': 'CLEAR',
        'interestelar': 'Não adentre a boa noite apenas com ternura, A velhice queima e clama ao cair do dia, Fúria, fúria contra a luz que já não fulgura. Embora os sábios, no fim da vida, saibam que é a treva que perdura...'
    };

    function removerAcentos(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    const systemCommandsNormalizados = {};
    Object.keys(systemCommands).forEach(chave => {
        systemCommandsNormalizados[removerAcentos(chave)] = chave;
    });

    function appendLine(html, tipo) {
        const p = document.createElement('p');
        if (tipo === 'erro') p.style.color = '#ff8478';
        p.innerHTML = html;
        terminalOutput.appendChild(p);
        terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    terminalForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const rawVal = terminalInput.value.trim();
        const inputVal = rawVal.toLowerCase();
        if (rawVal === '') return;

        appendLine(`<span class="prompt-symbol">gabriel@dev:~$</span> ${rawVal}`, 'comando');
        terminalInput.value = '';

        const inputSemAcento = removerAcentos(inputVal);
        const chaveResolvida = systemCommandsNormalizados[inputSemAcento];

        if (inputVal === 'clear') {
            terminalOutput.innerHTML = '';
        } else if (chaveResolvida !== undefined) {
            const resposta = systemCommands[chaveResolvida];
            appendLine(typeof resposta === 'function' ? resposta() : resposta);
        } else {
            appendLine(`comando não encontrado: ${rawVal} — digite "help" para ver a lista.`, 'erro');
        }
        terminalBody.scrollTop = terminalBody.scrollHeight;
    });
</script>
</body>
</html>
